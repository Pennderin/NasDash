---
# Homepage services config - https://gethomepage.dev/configs/services/

- Hardware:
    - Speed:
        target: _self
        icon: mdi-speedometer-#06b6d4
        href: http://192.168.0.190:7791/run-both
        description: WAN vs VPN
        widget:
          type: customapi
          url: http://192.168.0.190:7791/summary
          refreshInterval: 15000
          method: GET
          display: block
          mappings:
            - field: wan_speed
              label: WAN ↓/↑
              additionalField:
                field: running
                format: text
                color: adaptive
                remap:
                  - value: true
                    to: "TESTING…"
                  - value: false
                    to: ""
                  - any: true
                    to: ""
            - field: wan_ping
              label: WAN Ping
            - field: vpn_speed
              label: VPN ↓/↑
            - field: vpn_ping
              label: VPN Ping

    - Home:
        icon: home-assistant.png
        href: http://192.168.0.26:8123
